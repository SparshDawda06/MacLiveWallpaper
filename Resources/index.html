<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Liquid Kinetic Sphere Visualizer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; }
        canvas { display: block; }
    </style>
    <script src="three.min.js"></script>
</head>
<body>
<script>
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    let rt = new THREE.WebGLRenderTarget(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio);

    // --- SCENE 1: THE WORLD (Dust, Fog, Lyrics) ---
    const worldScene = new THREE.Scene();
    worldScene.background = new THREE.Color(0x000000); 
    worldScene.fog = new THREE.FogExp2(0x000000, 0.04); 
    const worldCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    worldCamera.position.z = 20;

    // Ethereal Dust Particles (Everywhere)
    const particlesGeo = new THREE.BufferGeometry();
    const particlesCount = 2500;
    const posArray = new Float32Array(particlesCount * 3);
    for(let i = 0; i < particlesCount * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 50;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    
    const pCanvas = document.createElement('canvas');
    pCanvas.width = 32; pCanvas.height = 32;
    const pCtx = pCanvas.getContext('2d');
    const pGradient = pCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
    pGradient.addColorStop(0, 'rgba(255,255,255,1)');
    pGradient.addColorStop(1, 'rgba(255,255,255,0)');
    pCtx.fillStyle = pGradient;
    pCtx.fillRect(0, 0, 32, 32);
    const pTex = new THREE.CanvasTexture(pCanvas);
    
    const particlesMat = new THREE.PointsMaterial({
        size: 0.15,
        map: pTex,
        transparent: true,
        opacity: 0.4,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });
    const dustParticles = new THREE.Points(particlesGeo, particlesMat);
    worldScene.add(dustParticles);

    // 2. Kinetic Lyrics System -> Centered
    const lyricStrings = [
        "WORK IT", "MAKE IT", "DO IT", "MAKES US",
        "HARDER", "BETTER", "FASTER", "STRONGER"
    ];
    let currentLyricIndex = 0;
    
    const lyricCanvas = document.createElement('canvas');
    lyricCanvas.width = 1024;
    lyricCanvas.height = 256;
    const lyricCtx = lyricCanvas.getContext('2d');
    const lyricTex = new THREE.CanvasTexture(lyricCanvas);
    lyricTex.minFilter = THREE.LinearFilter;
    
    const lyricMat = new THREE.MeshBasicMaterial({ map: lyricTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    
    const lyricPlaneBg = new THREE.Mesh(new THREE.PlaneGeometry(32, 8), lyricMat);
    lyricPlaneBg.position.set(0, 0, -5); 
    worldScene.add(lyricPlaneBg);
    
    const lyricPlaneFg = new THREE.Mesh(new THREE.PlaneGeometry(40, 10), lyricMat);
    lyricPlaneFg.position.set(0, 0, 8); 
    worldScene.add(lyricPlaneFg);

    function updateLyrics(text, bassPulse) {
        lyricCtx.clearRect(0, 0, lyricCanvas.width, lyricCanvas.height);
        
        if (bassPulse < 0.02) {
            lyricTex.needsUpdate = true;
            return;
        }

        lyricCtx.fillStyle = '#ffffff';
        lyricCtx.font = '900 140px "Arial Black", Impact, sans-serif';
        lyricCtx.textAlign = 'center';
        lyricCtx.textBaseline = 'middle';
        
        const glow = Math.floor(bassPulse * 40);
        lyricCtx.shadowColor = `rgba(0, 255, 200, ${bassPulse})`;
        lyricCtx.shadowBlur = glow;
        
        lyricCtx.scale(1.1, 1);
        lyricCtx.fillText(text, lyricCanvas.width / 2.2, lyricCanvas.height / 2);
        lyricCtx.scale(1/1.1, 1);
        lyricTex.needsUpdate = true;
    }

    // --- SCENE 2: EDGE-TO-EDGE BUBBLE LENS ---
    const lensScene = new THREE.Scene();
    const lensCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const LENS_VERTEX = `
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
    `;

    const LENS_FRAGMENT = `
        #define PI 3.14159265
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D uTex;
        uniform vec2 uRes;
        uniform float uAspect;
        uniform float uTime;
        uniform float uBass;

        uniform float uDispersion;
        uniform float uZoom;
        uniform float uRimTangential;
        uniform float uRimInward;
        uniform float uSizeX;
        uniform float uSizeY;
        uniform float uRotation;
        uniform float uShape;
        uniform float uSquareRound;

        float sdRoundBox(vec2 p, vec2 b, float r){
          vec2 q = abs(p) - b + r;
          return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
        }

        vec3 discLens(vec2 center, float aspectCorrect, out float outA) {
          vec2 p = (vUv - center);
          p.x *= aspectCorrect;
          
          float ca = cos(uRotation), sa = sin(uRotation);
          p = mat2(ca, -sa, sa, ca) * p;
          
          vec2 halfSize = vec2(uSizeX, uSizeY);
          float dist = length(p / halfSize);
          outA = 0.0;

          float maskND;
          if (uShape > 0.5) {
            float corner = min(uSizeX, uSizeY) * clamp(uSquareRound, 0.0, 1.0);
            float sd = sdRoundBox(p, halfSize, corner);
            maskND = 1.0 + sd / min(uSizeX, uSizeY);
          } else {
            maskND = dist;
          }
          if (maskND > 1.0) return vec3(0.0);

          float shapeND = clamp(maskND, 0.0, 1.0);
          float nd = clamp(dist, 0.0, 1.0);
          vec2 offset = vUv - center;
          vec2 radialDir = normalize(offset + 1e-6);
          vec2 tangentDir = vec2(-radialDir.y, radialDir.x);
          float angle = atan(p.y, p.x);

          float pull = uZoom * 0.30 * (nd * nd);
          float rimStrength = smoothstep(0.578, 1.0, nd);
          float fluidWave = sin(angle * 2.0 + uTime * 2.0) * 0.55 + sin(angle * 1.0 - uTime) * 0.25;
          float rScreen = (uSizeX + uSizeY) * 0.5;
          
          vec2 rimOff = tangentDir * fluidWave * rimStrength * rScreen * uRimTangential;
          vec2 rimPull = -radialDir * rimStrength * rScreen * uRimInward;

          vec2 baseUV = center + offset * (1.0 - pull) + rimOff + rimPull;

          float rimMask = smoothstep(0.55, 1.0, nd);
          vec2 dispDir = offset * uDispersion * 0.004 * rimMask;
          
          int MAX_SAMPLES = 16;
          vec3 col = vec3(0.0);
          vec3 caW = vec3(0.0);
          for (int i = 0; i < 16; i++) {
            float t = float(i) / 15.0;
            vec2 sUV = baseUV + dispDir * (t - 0.5);
            vec3 s = texture2D(uTex, sUV).rgb;
            vec3 w = vec3(
              exp(-pow((t - 0.00) / 0.38, 2.0)),
              exp(-pow((t - 0.50) / 0.38, 2.0)),
              exp(-pow((t - 1.00) / 0.38, 2.0))
            );
            col += s * w;
            caW += w;
          }
          col /= max(caW, vec3(0.001));

          col *= mix(0.91, 1.0, smoothstep(0.0, 0.38, shapeND));

          float dC = shapeND * 0.5;
          float tR = 0.49;
          float rW = 0.014;
          float ring = exp(-pow((dC - tR) / rW, 2.0));
          ring *= 6.0 * (4.2 / 17.0) * 1.8;
          ring *= sin(angle * 12.0 + uTime * 3.5) * 0.2 + 0.8; 
          col += vec3(0.0, 0.6, 1.0) * ring;
          
          col += vec3(exp(-pow((dC - 0.488) / 0.003, 2.0)) * 1.4);

          outA = smoothstep(1.0, 0.93, maskND);
          return col;
        }

        void main(){
          vec3 base = texture2D(uTex, vUv).rgb;
          vec3 outc = base;
          
          // Massive center bubble lens
          float a1 = 0.0;
          vec2 center1 = vec2(0.5, 0.5); 
          vec3 c1 = discLens(center1, uAspect, a1);
          outc = mix(outc, c1, a1);
          
          gl_FragColor = vec4(outc, 1.0);
        }
    `;

    const lensUniforms = {
        uTex: { value: rt.texture },
        uRes: { value: new THREE.Vector2(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio) },
        uAspect: { value: window.innerWidth / window.innerHeight },
        uTime: { value: 0 },
        uBass: { value: 0 },
        
        uDispersion: { value: 11.0 }, 
        uRimTangential: { value: 0.6 }, 
        uZoom: { value: 0 },
        uRimInward: { value: 0 },
        
        // Huge circular bubble spanning edge to edge
        uSizeX: { value: 0.9 }, 
        uSizeY: { value: 0.9 }, 
        uShape: { value: 0.0 }, // Circle
        uSquareRound: { value: 0.0 }, 
        uRotation: { value: 0 } 
    };

    const lensMat = new THREE.ShaderMaterial({
        uniforms: lensUniforms,
        vertexShader: LENS_VERTEX,
        fragmentShader: LENS_FRAGMENT,
        depthWrite: false,
        depthTest: false
    });

    const lensQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), lensMat);
    lensScene.add(lensQuad);

    // --- AUDIO SYSTEM ---
    const numBins = 32;
    let currentAudio = new Array(numBins).fill(0);
    window.updateAudio = function(data) {
        if (!data) return;
        for (let i = 0; i < Math.min(numBins, data.length); i++) {
            currentAudio[i] = currentAudio[i] * 0.7 + data[i] * 0.3;
        }
    };

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();
    let lastLyricTime = 0;

    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        
        const bass = ((currentAudio[0] || 0) + (currentAudio[1] || 0)) / 2;
        const kick = currentAudio[0] > 0.65; 

        dustParticles.rotation.y = time * 0.05 + bass * 0.05;
        dustParticles.rotation.x = time * 0.02;

        // Kinetic Lyrics Logic
        if (kick && (time - lastLyricTime) > 0.4) {
            currentLyricIndex = (currentLyricIndex + 1) % lyricStrings.length;
            lastLyricTime = time;
            lyricPlaneFg.scale.set(1.4, 1.4, 1.4);
        }
        
        lyricPlaneFg.position.y = Math.sin(time * 1.5) * 0.5;
        lyricPlaneBg.position.y = Math.sin(time * 1.5) * 0.5;

        lyricPlaneFg.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
        lyricPlaneBg.scale.set(1.5 + bass*0.5, 1.5 + bass*0.5, 1);
        
        lyricPlaneFg.rotation.z = Math.sin(time) * 0.05;
        lyricPlaneBg.rotation.z = Math.cos(time * 0.8) * -0.05;

        updateLyrics(lyricStrings[currentLyricIndex], bass);

        // Animate Massive Liquid Glass Bubble
        lensUniforms.uTime.value = time;
        lensUniforms.uBass.value = bass;
        lensUniforms.uZoom.value = bass * 0.2; 
        lensUniforms.uDispersion.value = 11.0 + bass * 2.0;

        // Render World to Render Target
        renderer.setRenderTarget(rt);
        renderer.render(worldScene, worldCamera);
        
        // Render Lens Scene to Screen
        renderer.setRenderTarget(null);
        renderer.render(lensScene, lensCamera);
    }
    animate();

    window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        
        worldCamera.aspect = w / h;
        worldCamera.updateProjectionMatrix();
        
        rt.setSize(w * window.devicePixelRatio, h * window.devicePixelRatio);
        lensUniforms.uRes.value.set(w * window.devicePixelRatio, h * window.devicePixelRatio);
        lensUniforms.uAspect.value = w / h;
    });
</script>
</body>
</html>
