<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Liquid Glass Visualizer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; }
        canvas { display: block; }
    </style>
    <script src="three.min.js"></script>
</head>
<body>
<script>
    // --- MAIN RENDERER ---
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- RENDER TARGET (For Post-Processing Lens) ---
    let rt = new THREE.WebGLRenderTarget(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio);

    // --- SCENE 1: THE WORLD (Globe + Lyrics) ---
    const worldScene = new THREE.Scene();
    // A dark, moody background
    worldScene.background = new THREE.Color(0x050510);
    const worldCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    worldCamera.position.z = 15;

    // The Central Globe
    const globeGeo = new THREE.SphereGeometry(2.5, 64, 64);
    const globeMat = new THREE.MeshStandardMaterial({ 
        color: 0x111111,
        emissive: 0x0044ff,
        emissiveIntensity: 0.5,
        roughness: 0.2,
        metalness: 0.9,
        wireframe: true // Makes it look holographic/cyber
    });
    const globe = new THREE.Mesh(globeGeo, globeMat);
    worldScene.add(globe);
    
    // A solid inner core for the globe
    const coreGeo = new THREE.SphereGeometry(2.4, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const core = new THREE.Mesh(coreGeo, coreMat);
    worldScene.add(core);

    const light = new THREE.PointLight(0xffffff, 2, 50);
    light.position.set(5, 5, 5);
    worldScene.add(light);
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    worldScene.add(ambientLight);

    // Flowing Lyrics/Text
    function createTextPlane(text, color) {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'Bold 80px Arial';
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // Add a glow to the text
        ctx.shadowColor = color;
        ctx.shadowBlur = 20;
        ctx.fillText(text, canvas.width/2, canvas.height/2);
        
        const tex = new THREE.CanvasTexture(canvas);
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending });
        // Make the plane large enough
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(16, 2), mat);
        return mesh;
    }
    
    const lyrics = [
        "FEEL THE RYTHM", "LOST IN THE ECHO", "LIQUID GLASS", 
        "CYBER DELUSION", "AUDIO WAVES", "SYSTEM OVERRIDE"
    ];
    const textMeshes = [];
    const colors = ['#00d4ff', '#ff0055', '#bb00ff', '#00ffaa'];
    
    lyrics.forEach((t, i) => {
        const c = colors[i % colors.length];
        const mesh = createTextPlane(t, c);
        // Position them across the screen in different Z planes
        mesh.position.set(
            (Math.random() - 0.5) * 40, 
            (Math.random() - 0.5) * 8, 
            (Math.random() - 0.5) * 10 - 2 // Between globe and camera, or behind
        );
        worldScene.add(mesh);
        textMeshes.push({ 
            mesh, 
            speed: 0.05 + Math.random() * 0.05,
            dir: Math.random() > 0.5 ? 1 : -1 
        });
    });

    // --- SCENE 2: LIQUID GLASS LENS SHADER ---
    const lensScene = new THREE.Scene();
    const lensCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const LENS_VERTEX = `
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
    `;

    const LENS_FRAGMENT = `
        #define PI 3.14159265
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D uTex;
        uniform vec2 uRes;
        uniform vec2 uCenter;
        uniform float uSizeX;
        uniform float uSizeY;
        uniform float uAspect;
        uniform float uZoom;
        uniform float uDispersion;
        uniform float uBlur;
        uniform float uGlow;
        uniform float uWhiteGlow;
        uniform float uNovaSize;
        uniform float uBlueRing;
        uniform float uRingRadius;
        uniform float uRingWidth;
        uniform float uShimmer;
        uniform float uShimmerFreq;
        uniform float uShimmerSpeed;
        uniform float uShimmerDepth;
        uniform float uTime;
        uniform float uRimStart;
        uniform float uRimTangential;
        uniform float uRimInward;
        uniform float uRimFreq1;
        uniform float uRimFreq2;
        uniform vec3 uBlueColor;
        uniform float uRimLine;
        uniform float uRimLinePos;
        uniform float uRimLineWidth;
        uniform float uVignette;
        uniform float uVignetteSize;
        uniform float uShape;
        uniform float uSquareRound;
        uniform float uRotation;
        uniform int uSamples;

        const int MAX_SAMPLES = 16;

        float sdRoundBox(vec2 p, vec2 b, float r){
          vec2 q = abs(p) - b + r;
          return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
        }

        vec3 discLens(vec2 center, float aspectCorrect, out float outA) {
          vec2 p = (vUv - center);
          p.x *= aspectCorrect;
          float ca = cos(uRotation), sa = sin(uRotation);
          p = mat2(ca, -sa, sa, ca) * p;
          vec2 halfSize = vec2(uSizeX, uSizeY);
          float dist = length(p / halfSize);
          outA = 0.0;

          float maskND;
          if (uShape > 0.5) {
            float corner = min(uSizeX, uSizeY) * clamp(uSquareRound, 0.0, 1.0);
            float sd = sdRoundBox(p, halfSize, corner);
            maskND = 1.0 + sd / min(uSizeX, uSizeY);
          } else {
            maskND = dist;
          }
          if (maskND > 1.0) return vec3(0.0);

          float shapeND = clamp(maskND, 0.0, 1.0);
          float nd = clamp(dist, 0.0, 1.0);
          vec2 offset = vUv - center;
          vec2 radialDir = normalize(offset + 1e-6);
          vec2 tangentDir = vec2(-radialDir.y, radialDir.x);
          float angle = atan(p.y, p.x);

          float pull = uZoom * 0.30 * (nd * nd);
          float rimStrength = smoothstep(uRimStart, 1.0, nd);
          float fluidWave = sin(angle * uRimFreq1 + uTime*2.0) * 0.55 + sin(angle * uRimFreq2 - uTime) * 0.25;
          float rScreen = (uSizeX + uSizeY) * 0.5;
          vec2 rimOff = tangentDir * fluidWave * rimStrength * rScreen * uRimTangential;
          vec2 rimPull = -radialDir * rimStrength * rScreen * uRimInward;

          vec2 baseUV = center + offset * (1.0 - pull) + rimOff + rimPull;

          float rimMask = smoothstep(0.55, 1.0, nd);
          vec2 dispDir = offset * uDispersion * 0.004 * rimMask;
          int N = uSamples;
          if (N < 2) N = 2;
          if (N > MAX_SAMPLES) N = MAX_SAMPLES;
          vec3 col = vec3(0.0);
          vec3 caW = vec3(0.0);
          for (int i = 0; i < MAX_SAMPLES; i++) {
            if (i >= N) break;
            float t = float(i) / float(N - 1);
            vec2 sUV = baseUV + dispDir * (t - 0.5);
            vec3 s = texture2D(uTex, sUV).rgb;
            vec3 w = vec3(
              exp(-pow((t - 0.00) / 0.38, 2.0)),
              exp(-pow((t - 0.50) / 0.38, 2.0)),
              exp(-pow((t - 1.00) / 0.38, 2.0))
            );
            col += s * w;
            caW += w;
          }
          col /= max(caW, vec3(0.001));

          col *= mix(0.91, 1.0, smoothstep(0.0, 0.38, shapeND));

          float r2 = shapeND * shapeND * 0.25;
          float gs = max(uNovaSize * uGlow * 0.003, 0.004);
          float nova = exp(-r2 / gs) + exp(-r2 / (gs * 7.0)) * 0.18;
          nova *= uWhiteGlow * (uGlow / 17.0) * 1.15;
          col += vec3(nova);

          float dC = shapeND * 0.5;
          float tR = clamp(uRingRadius, 0.1, 0.49);
          float rW = max(uRingWidth, 0.003);
          float ring = exp(-pow((dC - tR) / rW, 2.0));
          ring *= uBlueRing * (uGlow / 17.0) * 1.8;
          if (uShimmer > 0.5) ring *= sin(angle * uShimmerFreq + uTime * uShimmerSpeed) * uShimmerDepth + (1.0 - uShimmerDepth);
          float ringAura = exp(-pow((dC - tR) / (rW * 6.0), 2.0)) * 0.28 * uBlueRing * (uGlow / 17.0);
          col += uBlueColor * (ring + ringAura);
          col += vec3(exp(-pow((dC - uRimLinePos) / max(uRimLineWidth, 0.0001), 2.0)) * uRimLine);

          outA = smoothstep(1.0, 0.93, maskND);
          return col;
        }

        void main(){
          vec3 base = texture2D(uTex, vUv).rgb;
          vec3 outc = base;
          float a = 0.0;
          
          // Generate multiple wobbly lenses
          vec3 c1 = discLens(uCenter, uAspect, a);
          outc = mix(outc, c1, a);
          
          gl_FragColor = vec4(outc, 1.0);
        }
    `;

    const lensUniforms = {
        uTex: { value: rt.texture },
        uRes: { value: new THREE.Vector2(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio) },
        uCenter: { value: new THREE.Vector2(0.5, 0.5) },
        uSizeX: { value: 0.6 },
        uSizeY: { value: 0.6 },
        uAspect: { value: window.innerWidth / window.innerHeight },
        uZoom: { value: 0 },
        uDispersion: { value: 15 },
        uBlur: { value: 0 },
        uGlow: { value: 4.2 },
        uWhiteGlow: { value: 0.24 },
        uNovaSize: { value: 12 },
        uBlueRing: { value: 6 },
        uRingRadius: { value: 0.49 },
        uRingWidth: { value: 0.014 },
        uShimmer: { value: 1 },
        uShimmerFreq: { value: 12 },
        uShimmerSpeed: { value: 3.5 },
        uShimmerDepth: { value: 0.2 },
        uTime: { value: 0 },
        uRimStart: { value: 0.578 },
        uRimTangential: { value: 1.5 }, // INCREASED FOR MORE WAVING
        uRimInward: { value: 0.2 },
        uRimFreq1: { value: 2 },
        uRimFreq2: { value: 4 },
        uBlueColor: { value: new THREE.Color("#009dff") },
        uRimLine: { value: 1.4 },
        uRimLinePos: { value: 0.488 },
        uRimLineWidth: { value: 0.003 },
        uVignette: { value: 0 },
        uVignetteSize: { value: 0.3 },
        uShape: { value: 0 },
        uSquareRound: { value: 0 },
        uRotation: { value: 0 },
        uSamples: { value: 16 }
    };

    const lensMat = new THREE.ShaderMaterial({
        uniforms: lensUniforms,
        vertexShader: LENS_VERTEX,
        fragmentShader: LENS_FRAGMENT,
        depthWrite: false,
        depthTest: false
    });

    const lensQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), lensMat);
    lensScene.add(lensQuad);

    // --- AUDIO SYSTEM ---
    const numBins = 32;
    let currentAudio = new Array(numBins).fill(0);
    window.updateAudio = function(data) {
        if (!data) return;
        for (let i = 0; i < Math.min(numBins, data.length); i++) {
            currentAudio[i] = currentAudio[i] * 0.7 + data[i] * 0.3;
        }
    };

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        
        // Extract audio bass
        const bass = ((currentAudio[0] || 0) + (currentAudio[1] || 0)) / 2;

        // Animate Globe
        globe.rotation.y = time * 0.5;
        globe.rotation.x = time * 0.2;
        globeMat.emissiveIntensity = 0.5 + bass * 2.0;
        const scale = 1.0 + bass * 0.1;
        globe.scale.set(scale, scale, scale);

        // Animate Lyrics
        textMeshes.forEach(obj => {
            obj.mesh.position.x += obj.speed * obj.dir * (1.0 + bass * 2.0);
            // Wrap around screen
            if (obj.mesh.position.x > 30) obj.mesh.position.x = -30;
            if (obj.mesh.position.x < -30) obj.mesh.position.x = 30;
        });

        // Animate Liquid Glass Lens
        lensUniforms.uTime.value = time;
        lensUniforms.uZoom.value = -0.5 + Math.sin(time) * 0.2 + bass * 0.5; 
        
        // Make the lens wave, mutate, and pulse to the music
        lensUniforms.uRimTangential.value = 1.5 + Math.sin(time * 2.0) * 1.0 + bass * 2.0;
        lensUniforms.uRimInward.value = Math.cos(time * 1.5) * 0.5 - bass;
        
        // Size pulses with bass
        lensUniforms.uSizeX.value = 0.6 + bass * 0.1 + Math.sin(time * 0.5) * 0.1;
        lensUniforms.uSizeY.value = 0.6 + bass * 0.1 + Math.cos(time * 0.7) * 0.1;

        // Rotate the lens
        lensUniforms.uRotation.value = time * 0.1;

        // 1. Render World to Render Target
        renderer.setRenderTarget(rt);
        renderer.render(worldScene, worldCamera);
        
        // 2. Render Lens Scene to Screen
        renderer.setRenderTarget(null);
        renderer.render(lensScene, lensCamera);
    }
    animate();

    window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        
        worldCamera.aspect = w / h;
        worldCamera.updateProjectionMatrix();
        
        rt.setSize(w * window.devicePixelRatio, h * window.devicePixelRatio);
        lensUniforms.uRes.value.set(w * window.devicePixelRatio, h * window.devicePixelRatio);
        lensUniforms.uAspect.value = w / h;
    });
</script>
</body>
</html>
