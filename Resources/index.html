<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premium Spike Field</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; }
        canvas { display: block; }
    </style>
    <script src="three.min.js"></script>
</head>
<body>
<script>
    const scene = new THREE.Scene();
    // Add fog to fade out distant instances into black
    scene.fog = new THREE.FogExp2(0x000000, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    // Lighting (crucial for high-contrast monochrome reflections)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(0, 50, 50); // Overhead/Front stark white light
    scene.add(dirLight);
    
    const backLight = new THREE.DirectionalLight(0xffffff, 1.0);
    backLight.position.set(0, 10, -50);
    scene.add(backLight);

    // Audio Texture (32 bins)
    const numBins = 32;
    const audioDataArray = new Uint8Array(numBins * 4); 
    const audioTexture = new THREE.DataTexture(audioDataArray, numBins, 1, THREE.RGBAFormat);
    audioTexture.minFilter = THREE.LinearFilter;
    audioTexture.magFilter = THREE.LinearFilter;
    audioTexture.generateMipmaps = false;
    audioTexture.wrapS = THREE.ClampToEdgeWrapping;
    audioTexture.wrapT = THREE.ClampToEdgeWrapping;
    audioTexture.needsUpdate = true;
    
    const uniforms = {
        u_audioTex: { value: audioTexture },
        u_time: { value: 0 }
    };

    // Material with high metalness for high contrast reflections
    const material = new THREE.MeshStandardMaterial({
        color: 0x111111, // Dark grey/black for high contrast reflections
        metalness: 0.9,
        roughness: 0.1,
    });

    // We inject custom shader code to displace the instances based on audio and noise
    material.onBeforeCompile = (shader) => {
        shader.uniforms.u_audioTex = uniforms.u_audioTex;
        shader.uniforms.u_time = uniforms.u_time;
        
        shader.vertexShader = `
            uniform sampler2D u_audioTex;
            uniform float u_time;
            
            // Simplex 3D Noise 
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            float snoise(vec3 v){ 
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + 1.0 * C.xxx;
                vec3 x2 = x0 - i2 + 2.0 * C.xxx;
                vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
                i = mod(i, 289.0 ); 
                vec4 p = permute( permute( permute( 
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 1.0/7.0; // N=7
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z *ns.z);  //  mod(p,N*N)
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );    // mod(j,N)
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), 
                                            dot(p2,x2), dot(p3,x3) ) );
            }
            
        ` + shader.vertexShader;
        
        shader.vertexShader = shader.vertexShader.replace(
            `#include <begin_vertex>`,
            `
            vec3 transformed = vec3(position);
            
            // Get base position of the instance on the grid
            vec3 instanceBasePos = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
            
            // Map X position to an audio frequency band (0.0 to 1.0)
            // Grid width is roughly 64 * 1.2 = 76.8, so from -38.4 to +38.4
            float xMap = clamp((instanceBasePos.x + 38.0) / 76.0, 0.0, 1.0);
            
            // Animate the Z position to simulate moving forward
            // The grid loops every 1.2 units (the spacing)
            float zOffset = mod(u_time * 5.0, 1.2);
            instanceBasePos.z += zOffset;
            
            // Audio data based on X position (creates a spectrum analyzer effect across the city)
            float band = texture2D(u_audioTex, vec2(xMap, 0.5)).r;
            
            // Noise fallback for silence
            float noiseDisp = snoise(vec3(instanceBasePos.x * 0.1, instanceBasePos.z * 0.1, u_time * 0.2)) * 0.5;
            
            // Calculate height spike (ensure it goes mostly up)
            // If band is 0, use noise. If band > 0, spike massively.
            float spike = max(noiseDisp, band * 15.0);
            
            // Scale the Y axis of the building
            transformed.y *= 1.0 + spike;
            // Shift up so it grows from the base instead of the center
            transformed.y += (1.0 + spike) * 0.5 - 0.5;
            
            // Apply the scrolling Z offset to the vertex
            transformed.z += zOffset;
            `
        );
    };

    // The single voxel geometry (a skyscraper box)
    // Make it taller so it looks like a building
    const boxGeo = new THREE.BoxGeometry(0.8, 1.0, 0.8);
    
    // Create grid layout
    const gridCols = 64;
    const gridRows = 64;
    const count = gridCols * gridRows;
    const spacing = 1.2;
    
    const instancedMesh = new THREE.InstancedMesh(boxGeo, material, count);
    
    const dummy = new THREE.Object3D();
    let index = 0;
    for (let x = 0; x < gridCols; x++) {
        for (let z = 0; z < gridRows; z++) {
            // Center the grid around X=0, start Z from close to camera pushing back
            const posX = (x - gridCols / 2) * spacing;
            const posZ = -z * spacing; // Negative Z goes into the screen
            const posY = 0;
            
            dummy.position.set(posX, posY, posZ);
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(index, dummy.matrix);
            index++;
        }
    }
    
    scene.add(instancedMesh);
    
    // Adjust camera for bird's-eye view
    camera.position.set(0, 15, 5);
    camera.lookAt(0, 0, -20);

    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        
        const time = clock.getElapsedTime();
        uniforms.u_time.value = time;

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let currentAudio = new Array(numBins).fill(0);
    window.updateAudio = function(data) {
        if (!data || data.length < numBins) return;
        
        for (let i = 0; i < numBins; i++) {
            // Smooth the data to make it look highly polished
            currentAudio[i] = currentAudio[i] * 0.7 + data[i] * 0.3;
            const val = Math.min(255, Math.max(0, currentAudio[i] * 255));
            audioDataArray[i * 4] = val;     // R
            audioDataArray[i * 4 + 1] = val; // G
            audioDataArray[i * 4 + 2] = val; // B
            audioDataArray[i * 4 + 3] = 255; // A
        }
        audioTexture.needsUpdate = true;
    };
</script>
</body>
</html>
