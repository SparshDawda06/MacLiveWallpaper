<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Liquid Kinetic Sphere Visualizer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; }
        canvas { display: block; }
    </style>
    <script src="three.min.js"></script>
</head>
<body>
<script>
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Render target for the post-processing lenses
    let rt = new THREE.WebGLRenderTarget(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio);

    // --- SCENE 1: THE WORLD (Sphere + Kinetic Lyrics) ---
    const worldScene = new THREE.Scene();
    worldScene.background = new THREE.Color(0x020205);
    const worldCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    worldCamera.position.z = 20;

    // 1. Central Chromatic Glitch Sphere
    const sunGeo = new THREE.SphereGeometry(3, 64, 64);
    const sunMat = new THREE.ShaderMaterial({
        uniforms: {
            u_time: { value: 0 },
            u_bass: { value: 0 }
        },
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false,
        vertexShader: `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            void main() {
                vUv = uv;
                vNormal = normalize(normalMatrix * normal);
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vViewPosition = -mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            uniform float u_time;
            uniform float u_bass;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
            float snoise(vec2 v) {
                const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                vec2 i  = floor(v + dot(v, C.yy) );
                vec2 x0 = v -   i + dot(i, C.xx);
                vec2 i1;
                i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                vec4 x12 = x0.xyxy + C.xxzz;
                x12.xy -= i1;
                i = mod289(i);
                vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                m = m*m ; m = m*m ;
                vec3 x = 2.0 * fract(p * C.www) - 1.0;
                vec3 h = abs(x) - 0.5;
                vec3 ox = floor(x + 0.5);
                vec3 a0 = x - ox;
                m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                vec3 g;
                g.x  = a0.x  * x0.x  + h.x  * x0.y;
                g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                return 130.0 * dot(m, g);
            }

            float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 viewDir = normalize(vViewPosition);
                float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 1.2);
                float offset = 0.03 + u_bass * 0.1;
                
                float rNoise = snoise(vUv * 8.0 + vec2(offset, 0.0) - u_time * 0.2);
                float gNoise = snoise(vUv * 8.0 - u_time * 0.2);
                float bNoise = snoise(vUv * 8.0 + vec2(-offset, 0.0) - u_time * 0.2);
                
                float grain = random(vUv * 200.0 + u_time) * 0.3;
                
                float r = max(rNoise, 0.0) * 0.8 + fresnel + grain + u_bass * 0.7;
                float g = max(gNoise, 0.0) * 0.8 + fresnel + grain + u_bass * 0.3;
                float b = max(bNoise, 0.0) * 0.8 + fresnel + grain + u_bass * 0.9;
                
                vec3 finalColor = vec3(r, g, b);
                float mask = smoothstep(-0.1, 0.1, snoise(vUv * 5.0 + u_time * 0.1));
                float alpha = max(mask * 0.8, fresnel) + u_bass * 0.8;
                
                gl_FragColor = vec4(finalColor * mask * 1.5, min(alpha, 1.0));
            }
        `
    });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    worldScene.add(sun);

    // Atom Rings
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
    const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xff88cc, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
    const ringMat3 = new THREE.MeshBasicMaterial({ color: 0xccff88, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
    
    const ring1 = new THREE.Mesh(new THREE.TorusGeometry(3.6, 0.045, 8, 100), ringMat);
    ring1.rotation.x = Math.PI / 2.5;
    worldScene.add(ring1);
    
    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(4.05, 0.045, 8, 100), ringMat2);
    ring2.rotation.y = Math.PI / 3;
    worldScene.add(ring2);
    
    const ring3 = new THREE.Mesh(new THREE.TorusGeometry(4.5, 0.045, 8, 100), ringMat3);
    ring3.rotation.x = -Math.PI / 3;
    ring3.rotation.y = Math.PI / 4;
    worldScene.add(ring3);

    // 2. Kinetic Lyrics System
    const lyricStrings = [
        "WORK IT", "MAKE IT", "DO IT", "MAKES US",
        "HARDER", "BETTER", "FASTER", "STRONGER"
    ];
    let currentLyricIndex = 0;
    
    const lyricCanvas = document.createElement('canvas');
    lyricCanvas.width = 1024;
    lyricCanvas.height = 256;
    const lyricCtx = lyricCanvas.getContext('2d');
    const lyricTex = new THREE.CanvasTexture(lyricCanvas);
    lyricTex.minFilter = THREE.LinearFilter;
    
    const lyricMat = new THREE.MeshBasicMaterial({ map: lyricTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    // We use two planes for depth effect
    const lyricPlaneBg = new THREE.Mesh(new THREE.PlaneGeometry(32, 8), lyricMat);
    lyricPlaneBg.position.z = -5; // Behind sphere
    worldScene.add(lyricPlaneBg);
    
    const lyricPlaneFg = new THREE.Mesh(new THREE.PlaneGeometry(40, 10), lyricMat);
    lyricPlaneFg.position.z = 8; // In front of sphere
    worldScene.add(lyricPlaneFg);

    function updateLyrics(text, bassPulse) {
        lyricCtx.clearRect(0, 0, lyricCanvas.width, lyricCanvas.height);
        lyricCtx.fillStyle = '#ffffff';
        // Bold kinetic typography style
        lyricCtx.font = '900 160px "Arial Black", Impact, sans-serif';
        lyricCtx.textAlign = 'center';
        lyricCtx.textBaseline = 'middle';
        
        // Add a neon glow based on bass pulse
        const glow = Math.floor(bassPulse * 40);
        lyricCtx.shadowColor = `rgba(0, 255, 200, ${bassPulse})`;
        lyricCtx.shadowBlur = glow;
        
        // Draw standard text, stretched horizontally slightly
        lyricCtx.scale(1.2, 1);
        lyricCtx.fillText(text, lyricCanvas.width / 2.4, lyricCanvas.height / 2);
        lyricCtx.scale(1/1.2, 1);
        lyricTex.needsUpdate = true;
    }

    // --- SCENE 2: DUAL LIQUID GLASS LENSES ---
    const lensScene = new THREE.Scene();
    const lensCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const LENS_VERTEX = `
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
    `;

    const LENS_FRAGMENT = `
        #define PI 3.14159265
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D uTex;
        uniform vec2 uRes;
        uniform float uAspect;
        uniform float uTime;
        uniform float uBass;

        // Lens configuration
        uniform float uDispersion;
        uniform float uZoom;
        uniform float uRimTangential;
        uniform float uRimInward;
        uniform float uSizeX;
        uniform float uSizeY;
        uniform float uRotation;
        uniform float uShape;
        uniform float uSquareRound;

        float sdRoundBox(vec2 p, vec2 b, float r){
          vec2 q = abs(p) - b + r;
          return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
        }

        vec3 discLens(vec2 center, float aspectCorrect, out float outA) {
          vec2 p = (vUv - center);
          p.x *= aspectCorrect;
          
          float ca = cos(uRotation), sa = sin(uRotation);
          p = mat2(ca, -sa, sa, ca) * p;
          
          vec2 halfSize = vec2(uSizeX, uSizeY);
          float dist = length(p / halfSize);
          outA = 0.0;

          float maskND;
          if (uShape > 0.5) {
            float corner = min(uSizeX, uSizeY) * clamp(uSquareRound, 0.0, 1.0);
            float sd = sdRoundBox(p, halfSize, corner);
            maskND = 1.0 + sd / min(uSizeX, uSizeY);
          } else {
            maskND = dist;
          }
          if (maskND > 1.0) return vec3(0.0);

          float shapeND = clamp(maskND, 0.0, 1.0);
          float nd = clamp(dist, 0.0, 1.0);
          vec2 offset = vUv - center;
          vec2 radialDir = normalize(offset + 1e-6);
          vec2 tangentDir = vec2(-radialDir.y, radialDir.x);
          float angle = atan(p.y, p.x);

          float pull = uZoom * 0.30 * (nd * nd);
          float rimStrength = smoothstep(0.578, 1.0, nd);
          // 21st.dev default rim frequencies: 2 and 1
          float fluidWave = sin(angle * 2.0 + uTime * 2.0) * 0.55 + sin(angle * 1.0 - uTime) * 0.25;
          float rScreen = (uSizeX + uSizeY) * 0.5;
          
          vec2 rimOff = tangentDir * fluidWave * rimStrength * rScreen * uRimTangential;
          vec2 rimPull = -radialDir * rimStrength * rScreen * uRimInward;

          vec2 baseUV = center + offset * (1.0 - pull) + rimOff + rimPull;

          float rimMask = smoothstep(0.55, 1.0, nd);
          vec2 dispDir = offset * uDispersion * 0.004 * rimMask;
          
          int MAX_SAMPLES = 16;
          vec3 col = vec3(0.0);
          vec3 caW = vec3(0.0);
          for (int i = 0; i < 16; i++) {
            float t = float(i) / 15.0;
            vec2 sUV = baseUV + dispDir * (t - 0.5);
            vec3 s = texture2D(uTex, sUV).rgb;
            vec3 w = vec3(
              exp(-pow((t - 0.00) / 0.38, 2.0)),
              exp(-pow((t - 0.50) / 0.38, 2.0)),
              exp(-pow((t - 1.00) / 0.38, 2.0))
            );
            col += s * w;
            caW += w;
          }
          col /= max(caW, vec3(0.001));

          // Darken edges slightly
          col *= mix(0.91, 1.0, smoothstep(0.0, 0.38, shapeND));

          // Inner ring aura
          float dC = shapeND * 0.5;
          float tR = 0.49;
          float rW = 0.014;
          float ring = exp(-pow((dC - tR) / rW, 2.0));
          ring *= 6.0 * (4.2 / 17.0) * 1.8;
          ring *= sin(angle * 12.0 + uTime * 3.5) * 0.2 + 0.8; // Shimmer
          col += vec3(0.0, 0.6, 1.0) * ring;
          
          // Rim Line
          col += vec3(exp(-pow((dC - 0.488) / 0.003, 2.0)) * 1.4);

          outA = smoothstep(1.0, 0.93, maskND);
          return col;
        }

        void main(){
          vec3 base = texture2D(uTex, vUv).rgb;
          vec3 outc = base;
          
          // EXACTLY LIKE THE REFERENCE COMPONENT: Single massive distorted lens
          float a1 = 0.0;
          vec2 center1 = vec2(0.5, 0.5); 
          vec3 c1 = discLens(center1, uAspect, a1);
          outc = mix(outc, c1, a1);

          gl_FragColor = vec4(outc, 1.0);
        }
    `;

    const lensUniforms = {
        uTex: { value: rt.texture },
        uRes: { value: new THREE.Vector2(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio) },
        uAspect: { value: window.innerWidth / window.innerHeight },
        uTime: { value: 0 },
        uBass: { value: 0 },
        uDispersion: { value: 11 }, // default
        uZoom: { value: 0 },
        uRimTangential: { value: 0.6 }, // default
        uRimInward: { value: 0 },
        uSizeX: { value: 0.565 }, // exact default
        uSizeY: { value: 1.0 }, // exact default
        uShape: { value: 0 }, // 0 = circle/ellipse
        uSquareRound: { value: 0 },
        uRotation: { value: 65 * Math.PI / 180 } // exact default
    };

    const lensMat = new THREE.ShaderMaterial({
        uniforms: lensUniforms,
        vertexShader: LENS_VERTEX,
        fragmentShader: LENS_FRAGMENT,
        depthWrite: false,
        depthTest: false
    });

    const lensQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), lensMat);
    lensScene.add(lensQuad);

    // --- AUDIO SYSTEM ---
    const numBins = 32;
    let currentAudio = new Array(numBins).fill(0);
    window.updateAudio = function(data) {
        if (!data) return;
        for (let i = 0; i < Math.min(numBins, data.length); i++) {
            currentAudio[i] = currentAudio[i] * 0.7 + data[i] * 0.3;
        }
    };

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();
    let lastLyricTime = 0;

    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        
        // Extract bass
        const bass = ((currentAudio[0] || 0) + (currentAudio[1] || 0)) / 2;
        const kick = currentAudio[0] > 0.65; // A threshold for a "kick drum" hit

        // Animate Sphere and Rings
        sunMat.uniforms.u_time.value = time;
        sunMat.uniforms.u_bass.value = bass;
        
        ring1.rotation.z += 0.005 + bass * 0.015;
        ring2.rotation.x += 0.003 + bass * 0.01;
        ring3.rotation.y -= 0.007 + bass * 0.015;

        // Kinetic Lyrics Logic: Switch word on kick, but not too fast
        if (kick && (time - lastLyricTime) > 0.4) {
            currentLyricIndex = (currentLyricIndex + 1) % lyricStrings.length;
            lastLyricTime = time;
            
            // Jolt the foreground lyric plane
            lyricPlaneFg.scale.set(1.4, 1.4, 1.4);
        }
        
        // Smoothly return scale to normal
        lyricPlaneFg.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
        lyricPlaneBg.scale.set(1.5 + bass*0.5, 1.5 + bass*0.5, 1);
        
        // Slightly rotate the text planes for a kinetic, dynamic feel
        lyricPlaneFg.rotation.z = Math.sin(time) * 0.05;
        lyricPlaneBg.rotation.z = Math.cos(time * 0.8) * -0.05;

        updateLyrics(lyricStrings[currentLyricIndex], bass);

        // Animate Single Liquid Glass Lens
        lensUniforms.uTime.value = time;
        lensUniforms.uBass.value = bass;
        
        // Slight bass pulse to zoom
        lensUniforms.uZoom.value = Math.sin(time) * 0.1 + bass * 0.3; 
        
        // Gentle rotation wobble based on time and audio
        lensUniforms.uRotation.value = (65 * Math.PI / 180) + Math.sin(time * 0.5) * 0.05 + bass * 0.1;
        
        // Slight dispersion pulse on bass
        lensUniforms.uDispersion.value = 11 + bass * 5.0;

        // 1. Render World to Render Target
        renderer.setRenderTarget(rt);
        renderer.render(worldScene, worldCamera);
        
        // 2. Render Lens Scene to Screen
        renderer.setRenderTarget(null);
        renderer.render(lensScene, lensCamera);
    }
    animate();

    window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        
        worldCamera.aspect = w / h;
        worldCamera.updateProjectionMatrix();
        
        rt.setSize(w * window.devicePixelRatio, h * window.devicePixelRatio);
        lensUniforms.uRes.value.set(w * window.devicePixelRatio, h * window.devicePixelRatio);
        lensUniforms.uAspect.value = w / h;
    });
</script>
</body>
</html>
